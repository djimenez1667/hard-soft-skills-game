<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Skills Pool Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --hard-color: #2563eb;
            --soft-color: #9333ea;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
            overscroll-behavior: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        h1, h2, h3, .brand-font { font-family: 'Fredoka', sans-serif; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .bg-shapes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .shape { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.45; animation: float-around 20s ease-in-out infinite alternate; }
        @keyframes float-around { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, -50px) scale(1.2); } 100% { transform: translate(-30px, 40px) scale(0.9); } }

        .water-pool {
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 -10px 30px rgba(0,0,0,0.3), inset 0 10px 30px rgba(255,255,255,0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        
        .pool-hard { background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8); animation: water-ripple 7s ease-in-out infinite; }
        .pool-soft { background: radial-gradient(circle at 30% 30%, #c084fc, #6b21a8); animation: water-ripple 8s ease-in-out infinite reverse; }

        .water-pool:after, .water-pool:before {
            content: ''; position: absolute; pointer-events: none;
            border: 2px solid rgba(255,255,255,0.25);
            animation: water-ripple 5s ease-in-out infinite alternate; 
        }
        .water-pool:after { top: 8%; left: 8%; right: 8%; bottom: 8%; }
        .water-pool:before { top: 15%; left: 15%; right: 15%; bottom: 15%; border-color: rgba(255,255,255,0.1); animation-delay: -2s; }

        @keyframes water-ripple {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }
        
        .pool-active { transform: scale(1.12); box-shadow: 0 30px 60px rgba(0,0,0,0.2), inset 0 0 20px rgba(255,255,255,0.8); }

        .pool-counter {
            position: absolute; top: -15px; right: -15px; width: 44px; height: 44px;
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.2rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15), inset 0 -2px 5px rgba(0,0,0,0.05);
            z-index: 20; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 2.5);
        }
        .pool-counter.bump { transform: scale(1.5) rotate(10deg); }

        .word-card { 
            touch-action: none; cursor: grab; user-select: none; position: relative; z-index: 10;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s; 
            background: linear-gradient(to bottom, #ffffff, #f8fafc);
            border: 2px solid #e2e8f0; border-bottom-width: 4px; border-bottom-color: #cbd5e1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .word-card:hover { 
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1); border-color: #93c5fd; border-bottom-color: #60a5fa;
        }
        .word-card:active { cursor: grabbing; border-bottom-width: 2px; transform: translateY(2px); }
        .word-card.dragging { 
            position: absolute; z-index: 1000; pointer-events: none; 
            transform: scale(1.2) rotate(4deg); box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border-color: #3b82f6; border-bottom-color: #2563eb; background: #eff6ff;
        }

        .btn-3d { transition: all 0.1s; border-bottom-width: 6px; }
        .btn-3d:active { border-bottom-width: 2px; transform: translateY(4px); }

        /* Global tooltips to prevent clipping */
        #global-tooltip {
            position: fixed; pointer-events: none; z-index: 10000;
            background: linear-gradient(135deg, #1e293b, #0f172a); color: white; 
            padding: 10px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; 
            text-align: center; box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255,255,255,0.1); max-width: 260px; width: max-content;
            opacity: 0; transform: translate(-50%, 10px); transition: opacity 0.2s, transform 0.2s;
        }
        #global-tooltip.visible { opacity: 1; transform: translate(-50%, -100%); }
        #global-tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -8px;
            border-width: 8px; border-style: solid; border-color: #1e293b transparent transparent transparent;
        }

        .splash-effect { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%); transform: scale(0); animation: ripple 0.7s ease-out; pointer-events: none; z-index: 15;}
        @keyframes ripple { to { transform: scale(4.5); opacity: 0; } }
        
        .anim-wrong { animation: wrong-shake 0.5s ease-in-out; background: linear-gradient(to bottom, #fef2f2, #fee2e2) !important; color: #b91c1c !important; border-color: #ef4444 !important; border-bottom-color: #dc2626 !important; }
        @keyframes wrong-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-12px) rotate(-2deg); } 40%, 80% { transform: translateX(12px) rotate(2deg); } }

        #confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; overflow: hidden; }
        .confetti { position: absolute; width: 10px; height: 10px; opacity: 0; animation: fall 3s linear forwards; }
        @keyframes fall { 0% { opacity: 1; transform: translateY(-20px) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen text-slate-800 flex flex-col relative">

    <div id="global-tooltip"></div>
    <div id="confetti-container"></div>

    <div class="bg-shapes">
        <div class="shape" style="width: 400px; height: 400px; top: -100px; left: -100px; background: #38bdf8; animation-delay: 0s;"></div>
        <div class="shape" style="width: 500px; height: 500px; top: 30%; right: -150px; background: #a78bfa; animation-delay: -5s;"></div>
        <div class="shape" style="width: 350px; height: 350px; bottom: -50px; left: 20%; background: #34d399; animation-delay: -10s;"></div>
    </div>

    <header class="bg-white/90 backdrop-blur-lg shadow-sm p-3 md:p-4 z-40 relative flex justify-between items-center shrink-0 border-b border-white">
        <div class="flex items-center gap-3 w-1/4">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white w-11 h-11 md:w-12 md:h-12 rounded-2xl flex items-center justify-center font-bold text-2xl shadow-lg transform rotate-3 border-2 border-white">🎓</div>
            <h1 class="text-xl md:text-2xl hidden md:block font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-700 tracking-tight brand-font">Campus Skills</h1>
        </div>
        
        <div class="flex justify-center">
            <div id="level-indicator" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-5 md:px-7 py-2 rounded-full shadow-lg shadow-indigo-200/50 font-bold brand-font text-sm md:text-lg border-2 border-white/50 whitespace-nowrap transform transition-all">
                Stage 1 of 5
            </div>
        </div>

        <div class="w-1/3 flex justify-end items-center gap-3 md:gap-4 relative">
            <div id="score-popup-container" class="absolute -bottom-10 right-16 pointer-events-none z-50"></div>

            <button id="audio-toggle" onclick="toggleAudio()" class="w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-lg shadow-sm border border-slate-200/80 transition-all active:scale-95" title="Toggle Lo-Fi Music & Sound">
                🔇
            </button>

            <div class="bg-gradient-to-r from-amber-400 via-emerald-400 to-emerald-500 p-0.5 rounded-2xl shadow-lg shadow-emerald-500/20 transform hover:scale-105 transition-transform">
                <div class="bg-white/95 backdrop-blur-md px-4 py-1.5 md:px-5 md:py-2 rounded-[14px] flex items-center gap-2 md:gap-3">
                    <span class="text-xl md:text-2xl animate-bounce">🏆</span>
                    <div class="text-left">
                        <p class="text-[9px] md:text-[10px] text-slate-400 font-black tracking-widest uppercase leading-none">SCORE</p>
                        <p class="text-2xl md:text-3xl brand-font text-slate-800 leading-none font-black mt-0.5 transition-all" id="score-display">0</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full max-w-7xl mx-auto p-4 md:p-6 gap-6 md:gap-8 h-full z-10">
        
        <div class="glass-panel rounded-[2rem] p-5 md:p-6 w-full flex flex-col relative z-30 mb-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-700 brand-font text-xl md:text-2xl flex items-center gap-2">
                    <span class="text-2xl">📚</span> Skill Bank 
                </h2>
                <span class="text-sm font-bold bg-white text-slate-600 px-4 py-1.5 rounded-full shadow-sm border border-slate-100" id="words-left"></span>
            </div>
            
            <div id="word-bank" class="flex flex-wrap justify-center gap-3 md:gap-4 pb-8 items-start content-start relative overflow-visible min-h-[140px]">
                <!-- Words injected dynamically -->
            </div>
            
            <div class="mt-2 flex justify-center hidden absolute -bottom-6 left-0 right-0 z-40" id="check-action-container">
                <button onclick="checkAnswers()" class="btn-3d bg-gradient-to-r from-emerald-400 to-emerald-600 border-emerald-700 hover:from-emerald-500 hover:to-emerald-700 text-white font-extrabold py-3 px-12 rounded-full shadow-2xl brand-font text-xl border-4 border-t-white/50 border-l-white/50">
                    Check Answers ✓
                </button>
            </div>
        </div>

        <div class="flex flex-row justify-center gap-6 md:gap-24 flex-1 items-center pb-8 min-h-[40%] z-20">
            
            <div class="flex flex-col items-center w-1/2 max-w-[300px]">
                <h3 class="brand-font text-blue-900 font-bold bg-white/90 backdrop-blur-sm px-6 py-2 rounded-2xl mb-6 shadow-sm border border-blue-100 text-lg md:text-xl">⚙️ Hard Skills</h3>
                <div class="relative">
                    <div id="hard-pool-count" class="pool-counter text-blue-600 border-4 border-blue-200">0</div>
                    <div id="pool-hard" class="water-pool pool-hard w-40 h-40 md:w-64 md:h-64 border-[8px] border-blue-200/50 cursor-pointer" data-type="hard" onclick="showPoolModal('hard')">
                        <span class="text-white font-extrabold brand-font text-lg md:text-2xl pointer-events-none drop-shadow-md px-2 absolute text-center z-0 opacity-90">Specific &<br>Teachable</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col items-center w-1/2 max-w-[300px]">
                <h3 class="brand-font text-purple-900 font-bold bg-white/90 backdrop-blur-sm px-6 py-2 rounded-2xl mb-6 shadow-sm border border-purple-100 text-lg md:text-xl">🧠 Soft Skills</h3>
                <div class="relative">
                    <div id="soft-pool-count" class="pool-counter text-purple-600 border-4 border-purple-200">0</div>
                    <div id="pool-soft" class="water-pool pool-soft w-40 h-40 md:w-64 md:h-64 border-[8px] border-purple-200/50 cursor-pointer" data-type="soft" onclick="showPoolModal('soft')">
                        <span class="text-white font-extrabold brand-font text-lg md:text-2xl pointer-events-none drop-shadow-md px-2 absolute text-center z-0 opacity-90">Interpersonal &<br>Behaviors</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 overflow-y-auto pt-10 pb-10">
        <div class="bg-white rounded-[2rem] p-8 md:p-10 max-w-lg w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300 text-center border-4 border-white/50 relative" id="modal-content">
            <!-- Modal Body injected via JS -->
        </div>
    </div>

    <script>
        const levelData = [
            { industry: "Retail", icon: "🛍️", words: [{ text: "Inventory", type: "hard", desc: "Tracking store stock levels." }, { text: "POS Systems", type: "hard", desc: "Using cash registers & tech." }, { text: "Merchandising", type: "hard", desc: "Arranging products visually." }, { text: "Cash Handling", type: "hard", desc: "Processing money accurately." }, { text: "Store Displays", type: "hard", desc: "Setting up store promotions." }, { text: "Customer Relations", type: "soft", desc: "Building rapport with buyers." }, { text: "Teamwork", type: "soft", desc: "Collaborating with staff." }, { text: "Adaptability", type: "soft", desc: "Adjusting to sudden changes." }, { text: "Patience", type: "soft", desc: "Remaining calm under stress." }, { text: "Communication", type: "soft", desc: "Conveying info clearly." }] },
            { industry: "Customer Service", icon: "🎧", words: [{ text: "CRM Software", type: "hard", desc: "Using customer databases." }, { text: "Data Entry", type: "hard", desc: "Inputting info accurately." }, { text: "Multilingual", type: "hard", desc: "Speaking multiple languages." }, { text: "Typing Speed", type: "hard", desc: "Words per minute (WPM)." }, { text: "Ticketing Systems", type: "hard", desc: "Tracking support requests." }, { text: "Empathy", type: "soft", desc: "Sharing customer feelings." }, { text: "Active Listening", type: "soft", desc: "Paying full attention." }, { text: "Problem Solving", type: "soft", desc: "Finding clever solutions." }, { text: "De-escalation", type: "soft", desc: "Calming upset customers." }, { text: "Positive Attitude", type: "soft", desc: "Remaining cheerful." }] },
            { industry: "Medical", icon: "⚕️", words: [{ text: "CPR Certified", type: "hard", desc: "Trained in resuscitation." }, { text: "Phlebotomy", type: "hard", desc: "Drawing blood safely." }, { text: "Patient Charting", type: "hard", desc: "Recording medical history." }, { text: "Medical Terms", type: "hard", desc: "Understanding healthcare vocab." }, { text: "Vital Signs", type: "hard", desc: "Measuring heart rate, BP, etc." }, { text: "Compassion", type: "soft", desc: "Showing deep care & sympathy." }, { text: "Stress Management", type: "soft", desc: "Handling high pressure." }, { text: "Attention to Detail", type: "soft", desc: "Noticing critical changes." }, { text: "Work Ethics", type: "soft", desc: "Adhering to strict standards." }, { text: "Time Management", type: "soft", desc: "Prioritizing urgent tasks." }] },
            { industry: "Tech & Software", icon: "💻", words: [{ text: "Python / JS", type: "hard", desc: "Writing application code." }, { text: "Git / GitHub", type: "hard", desc: "Code version control." }, { text: "SQL Databases", type: "hard", desc: "Querying structured data." }, { text: "API Design", type: "hard", desc: "Building backend services." }, { text: "Debugging", type: "hard", desc: "Finding & fixing code bugs." }, { text: "Collaboration", type: "soft", desc: "Working with cross-functional teams." }, { text: "Critical Thinking", type: "soft", desc: "Analyzing complex logic." }, { text: "Agile Mindset", type: "soft", desc: "Adapting to fast iterations." }, { text: "Mentorship", type: "soft", desc: "Guiding junior teammates." }, { text: "Creativity", type: "soft", desc: "Inventing novel solutions." }] },
            { industry: "Hospitality", icon: "🍳", words: [{ text: "Food Safety", type: "hard", desc: "Sanitary kitchen standards." }, { text: "Knife Skills", type: "hard", desc: "Prep & chopping techniques." }, { text: "POS Ordering", type: "hard", desc: "Processing ticket orders." }, { text: "Beverage Crafting", type: "hard", desc: "Preparing coffee & drinks." }, { text: "Inventory Audit", type: "hard", desc: "Stocking ingredients." }, { text: "Conflict Resolution", type: "soft", desc: "Handling guest complaints." }, { text: "Multitasking", type: "soft", desc: "Managing tables under rush." }, { text: "Warm Hospitality", type: "soft", desc: "Creating a welcoming vibe." }, { text: "Punctuality", type: "soft", desc: "Arriving reliably on time." }, { text: "Stress Resilience", type: "soft", desc: "Staying cool during dinner rush." }] }
        ];

        let currentLevel = 0, score = 0, wordsRemaining = 0;
        let hardPoolContent = [], softPoolContent = [];
        
        const wordBankEl = document.getElementById('word-bank');
        const scoreDisplayEl = document.getElementById('score-display');
        const wordsLeftEl = document.getElementById('words-left');
        const checkActionContainer = document.getElementById('check-action-container');
        const levelIndicatorEl = document.getElementById('level-indicator');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const tooltipEl = document.getElementById('global-tooltip');

        let audioCtx, audioEnabled = false, bgmSequenceTimer;
        let masterGainNode, filterNode;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.setValueAtTime(1400, audioCtx.currentTime);

                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.setValueAtTime(0.28, audioCtx.currentTime);

                filterNode.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            audioEnabled = true;
            document.getElementById('audio-toggle').textContent = '🔊';
            document.getElementById('audio-toggle').classList.replace('text-slate-600', 'text-blue-600');
            startLoFiBGM();
        }

        function toggleAudio() {
            if (!audioCtx) initAudio();
            else {
                audioEnabled = !audioEnabled;
                document.getElementById('audio-toggle').textContent = audioEnabled ? '🔊' : '🔇';
                document.getElementById('audio-toggle').classList.toggle('text-blue-600', audioEnabled);
                if (audioEnabled) startLoFiBGM(); else stopBGM();
            }
            playSFX('pop');
        }

        function playRhodesNote(freq, duration = 1.2, vol = 0.12, timeOffset = 0) {
            if (!audioEnabled || !audioCtx) return;
            const now = audioCtx.currentTime + timeOffset;
            
            const osc1 = audioCtx.createOscillator(); osc1.type = 'sine'; osc1.frequency.setValueAtTime(freq, now);
            const osc2 = audioCtx.createOscillator(); osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq * 2, now);
            const gain1 = audioCtx.createGain(); const gain2 = audioCtx.createGain();

            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(vol, now + 0.04);
            gain1.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(vol * 0.25, now + 0.02);
            gain2.gain.exponentialRampToValueAtTime(0.0001, now + (duration * 0.5));

            osc1.connect(gain1); osc2.connect(gain2);
            gain1.connect(filterNode); gain2.connect(filterNode);

            osc1.start(now); osc2.start(now);
            osc1.stop(now + duration); osc2.stop(now + duration);
        }

        const bgmProgression = [
            { chord: [130.81, 164.81, 196.00, 246.94, 293.66], melody: [293.66, 329.63, 392.00] },
            { chord: [110.00, 130.81, 164.81, 196.00, 246.94], melody: [246.94, 261.63, 329.63] },
            { chord: [87.31, 110.00, 130.81, 164.81], melody: [220.00, 261.63, 329.63] },
            { chord: [98.00, 123.47, 146.83, 174.61, 220.00], melody: [196.00, 246.94, 293.66] }
        ];

        let bgmStep = 0;
        function startLoFiBGM() {
            stopBGM();
            bgmStep = 0;
            function playNextMeasure() {
                if (!audioEnabled) return;
                const currentPattern = bgmProgression[bgmStep];
                currentPattern.chord.forEach((freq, i) => playRhodesNote(freq, 2.8, 0.08, i * 0.05));
                currentPattern.melody.forEach((freq, i) => playRhodesNote(freq, 1.0, 0.06, 0.8 + (i * 0.4)));
                bgmStep = (bgmStep + 1) % bgmProgression.length;
            }
            playNextMeasure();
            bgmSequenceTimer = setInterval(playNextMeasure, 3200);
        }

        function stopBGM() { if (bgmSequenceTimer) clearInterval(bgmSequenceTimer); }

        function playSFX(type) {
            if (!audioEnabled || !audioCtx) return;
            const now = audioCtx.currentTime;

            switch(type) {
                case 'pop': case 'grab': {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.04);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain); gain.connect(masterGainNode); osc.start(now); osc.stop(now + 0.05);
                    break;
                }
                case 'splash': {
                    // Layer 1: Liquid Bloop
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(130, now + 0.035);
                    osc.frequency.exponentialRampToValueAtTime(920, now + 0.12);
                    gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.32, now + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain); gain.connect(masterGainNode); osc.start(now); osc.stop(now + 0.18);

                    // Layer 2: Droplet Ring
                    const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
                    osc2.type = 'triangle'; osc2.frequency.setValueAtTime(1100, now + 0.02);
                    osc2.frequency.exponentialRampToValueAtTime(1850, now + 0.08);
                    gain2.gain.setValueAtTime(0, now + 0.02); gain2.gain.linearRampToValueAtTime(0.14, now + 0.035);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
                    osc2.connect(gain2); gain2.connect(masterGainNode); osc2.start(now + 0.02); osc2.stop(now + 0.10);

                    // Layer 3: Water Spray Noise
                    const bufferSize = audioCtx.sampleRate * 0.08;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                    const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'bandpass';
                    noiseFilter.frequency.setValueAtTime(3200, now); noiseFilter.Q.setValueAtTime(1.8, now);
                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.setValueAtTime(0.18, now); noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGainNode);
                    noise.start(now); noise.stop(now + 0.08);
                    break;
                }
                case 'fish_out': {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(920, now); osc.frequency.exponentialRampToValueAtTime(260, now + 0.08);
                    gain.gain.setValueAtTime(0.28, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.connect(gain); gain.connect(masterGainNode); osc.start(now); osc.stop(now + 0.09);
                    break;
                }
                case 'wrong': {
                    [180, 130].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const startTime = now + (idx * 0.09);
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, startTime); osc.frequency.exponentialRampToValueAtTime(freq * 0.6, startTime + 0.12);
                        gain.gain.setValueAtTime(0.18, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.12);
                        osc.connect(gain); gain.connect(masterGainNode); osc.start(startTime); osc.stop(startTime + 0.12);
                    });
                    break;
                }
                case 'correct': {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => playRhodesNote(freq, 0.7, 0.16, i * 0.06));
                    break;
                }
                case 'win': {
                    [261.63, 329.63, 392.00, 493.88, 523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => playRhodesNote(freq, 1.4, 0.18, i * 0.08));
                    break;
                }
            }
        }

        function fireConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444'];
            for(let i=0; i<100; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(conf);
            }
            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        function initGame() { currentLevel = 0; score = 0; updateScore(0); showIntroModal(); }

        function loadLevel(idx) {
            currentLevel = idx;
            const level = levelData[idx];
            levelIndicatorEl.innerHTML = `${level.icon} Stage ${idx + 1} of ${levelData.length}: ${level.industry}`;
            levelIndicatorEl.classList.remove('scale-100'); levelIndicatorEl.classList.add('scale-110', 'bg-emerald-500', 'border-emerald-300');
            setTimeout(() => { levelIndicatorEl.classList.remove('scale-110', 'bg-emerald-500', 'border-emerald-300'); levelIndicatorEl.classList.add('scale-100'); }, 500);

            wordBankEl.innerHTML = ''; hardPoolContent = []; softPoolContent = []; 
            updatePoolCounters(); checkActionContainer.classList.add('hidden');
            
            let words = [...level.words].sort(() => Math.random() - 0.5);
            wordsRemaining = words.length;
            words.forEach(addWordToBankDOM);
            updateWordsLeft();
        }

        function showTooltip(e) {
            if (draggedItem) return;
            const target = e.currentTarget;
            tooltipEl.textContent = target.dataset.desc;
            
            const rect = target.getBoundingClientRect();
            let top = rect.top - 8;
            let left = rect.left + (rect.width / 2);
            
            tooltipEl.style.left = left + 'px';
            tooltipEl.style.top = top + 'px';
            tooltipEl.classList.add('visible');
        }
        
        function hideTooltip() { tooltipEl.classList.remove('visible'); }

        function addWordToBankDOM(w) {
            const el = document.createElement('div');
            el.className = 'word-card text-slate-700 py-3 px-5 rounded-2xl font-extrabold text-sm md:text-base whitespace-nowrap';
            el.textContent = w.text;
            el.dataset.type = w.type;
            el.dataset.text = w.text;
            el.dataset.desc = w.desc;

            el.addEventListener('pointerenter', showTooltip);
            el.addEventListener('pointerleave', hideTooltip);
            el.addEventListener('pointerdown', startDrag);
            wordBankEl.appendChild(el);
        }

        function updateScore(points) { 
            score = Math.max(0, score + points); 
            scoreDisplayEl.textContent = score; 
            
            if(points !== 0) {
                scoreDisplayEl.style.transform = points > 0 ? 'scale(1.4)' : 'scale(0.8)';
                scoreDisplayEl.style.color = points > 0 ? '#10b981' : '#ef4444';
                setTimeout(() => { scoreDisplayEl.style.transform = 'scale(1)'; scoreDisplayEl.style.color = ''; }, 350);

                const popupContainer = document.getElementById('score-popup-container');
                if (popupContainer) {
                    const pop = document.createElement('div');
                    pop.className = `font-black text-xl md:text-2xl brand-font transition-all duration-700 transform ${points > 0 ? 'text-emerald-500' : 'text-red-500'}`;
                    pop.textContent = (points > 0 ? '+' : '') + points;
                    pop.style.position = 'absolute'; pop.style.right = '10px'; pop.style.top = '0px'; pop.style.opacity = '1';
                    popupContainer.appendChild(pop);
                    setTimeout(() => { pop.style.transform = 'translateY(-35px) scale(1.3)'; pop.style.opacity = '0'; }, 50);
                    setTimeout(() => { pop.remove(); }, 750);
                }
            }
        }

        function updateWordsLeft() { wordsLeftEl.textContent = `${wordsRemaining} Skills Left`; checkActionContainer.classList.toggle('hidden', wordsRemaining > 0); }

        function updatePoolCounters() {
            const hardBadge = document.getElementById('hard-pool-count');
            const softBadge = document.getElementById('soft-pool-count');
            if(hardBadge.textContent != hardPoolContent.length) { hardBadge.textContent = hardPoolContent.length; bumpCounter(hardBadge); }
            if(softBadge.textContent != softPoolContent.length) { softBadge.textContent = softPoolContent.length; bumpCounter(softBadge); }
        }
        function bumpCounter(el) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 300); }

        let draggedItem = null, startX, startY;
        
        function startDrag(e) { 
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            hideTooltip();
            playSFX('grab');
            draggedItem = e.currentTarget; 
            
            const rect = draggedItem.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            draggedItem.classList.add('dragging');
            draggedItem.style.width = rect.width + 'px';
            document.body.appendChild(draggedItem);
            
            moveDrag(e);
            document.addEventListener('pointermove', moveDrag, { passive: false }); 
            document.addEventListener('pointerup', endDrag); 
            e.preventDefault();
        }
        
        function moveDrag(e) { 
            if(!draggedItem) return;
            e.preventDefault();
            draggedItem.style.left = (e.clientX - startX) + 'px'; 
            draggedItem.style.top = (e.clientY - startY) + 'px'; 
            
            document.querySelectorAll('.water-pool').forEach(pool => {
                const rect = pool.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) { pool.classList.add('pool-active'); }
                else { pool.classList.remove('pool-active'); }
            });
        }
        
        function endDrag(e) {
            if(!draggedItem) return;
            document.removeEventListener('pointermove', moveDrag); 
            document.removeEventListener('pointerup', endDrag);

            let placed = false;
            const pools = document.querySelectorAll('.water-pool');
            pools.forEach(pool => {
                pool.classList.remove('pool-active');
                const rect = pool.getBoundingClientRect();
                if (!placed && e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    const w = { text: draggedItem.dataset.text, type: draggedItem.dataset.type, desc: draggedItem.dataset.desc };
                    pool.dataset.type === 'hard' ? hardPoolContent.push(w) : softPoolContent.push(w);
                    
                    playSFX('splash'); createSplash(pool);
                    
                    draggedItem.remove(); wordsRemaining--; 
                    updateWordsLeft(); updatePoolCounters();
                    placed = true;
                }
            });

            if(!placed) {
                playSFX('pop');
                draggedItem.classList.remove('dragging');
                draggedItem.removeAttribute('style'); 
                wordBankEl.appendChild(draggedItem);
            }
            draggedItem = null; 
        }

        function createSplash(pool) {
            const splash = document.createElement('div');
            splash.className = 'splash-effect w-16 h-16';
            splash.style.left = 'calc(50% - 32px)'; splash.style.top = 'calc(50% - 32px)';
            pool.appendChild(splash); setTimeout(() => splash.remove(), 700);
        }

        function showModal(html) {
            modalContent.innerHTML = html; modalOverlay.classList.remove('hidden');
            void modalOverlay.offsetWidth; 
            modalOverlay.classList.remove('opacity-0'); modalContent.classList.remove('scale-95');
        }

        function hideModal() {
            modalOverlay.classList.add('opacity-0'); modalContent.classList.add('scale-95');
            setTimeout(() => modalOverlay.classList.add('hidden'), 300);
        }

        function showIntroModal() {
            showModal(`
                <div class="absolute -top-10 -left-10 w-32 h-32 bg-blue-100 rounded-full mix-blend-multiply filter blur-xl opacity-70 pointer-events-none"></div>
                <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-purple-100 rounded-full mix-blend-multiply filter blur-xl opacity-70 pointer-events-none"></div>
                <div class="text-7xl mb-4 drop-shadow-md relative z-10">🏫</div>
                <h2 class="text-4xl brand-font font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-700 mb-2 relative z-10">Welcome to Campus!</h2>
                <p class="text-slate-600 mb-6 font-bold relative z-10">Sort the skills into the correct pools. Drag words to place them.</p>
                <div class="bg-blue-50/80 p-4 rounded-2xl text-sm text-left mb-8 text-slate-700 border border-blue-200 relative z-10 shadow-inner">
                    <span class="text-blue-600 font-black">TIP:</span> Hover over a skill if you need a hint! Correct placements earn <span class="text-emerald-600 font-bold">+10 pts</span>, but wrong ones cost <span class="text-red-500 font-bold">-10 pts</span>.
                </div>
                <button onclick="initAudio(); hideModal(); loadLevel(0);" class="btn-3d relative z-10 bg-gradient-to-r from-blue-600 to-indigo-600 border-indigo-800 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-lg py-4 px-10 rounded-full w-full transition-all shadow-xl">Start Challenge</button>
            `);
        }

        function showPoolModal(poolType) {
            playSFX('pop');
            const pool = poolType === 'hard' ? hardPoolContent : softPoolContent;
            const titleColor = poolType === 'hard' ? 'text-blue-800' : 'text-purple-800';
            const titleText = poolType === 'hard' ? '⚙️ Hard Skills Pool' : '🧠 Soft Skills Pool';

            let html = `<h2 class="text-3xl brand-font font-extrabold ${titleColor} mb-2">${titleText}</h2>
                        <p class="text-sm text-slate-500 mb-6 font-bold">Click a tag to fish it out.</p>
                        <div class="flex flex-wrap gap-3 justify-center max-h-[40vh] overflow-y-auto no-scrollbar p-2 mb-6">`;

            if (pool.length === 0) { html += `<p class="text-slate-400 italic w-full text-center py-8 font-bold">This pool is empty.</p>`; } 
            else {
                pool.forEach((word, index) => {
                    const tagStyles = poolType === 'hard' ? 'bg-blue-50 hover:bg-red-50 text-blue-800 hover:text-red-600 border-blue-200 hover:border-red-300' : 'bg-purple-50 hover:bg-red-50 text-purple-800 hover:text-red-600 border-purple-200 hover:border-red-300';
                    html += `<button onclick="removeWordFromPool('${poolType}', ${index})" class="${tagStyles} border-2 font-extrabold py-2 px-5 rounded-full shadow-sm transition-all text-sm flex items-center gap-2 transform hover:scale-105 btn-3d">${word.text} <span class="text-xs opacity-70">✖</span></button>`;
                });
            }
            html += `</div><button onclick="hideModal(); playSFX('pop');" class="btn-3d bg-slate-200 hover:bg-slate-300 border-slate-400 text-slate-700 font-extrabold py-3 px-8 rounded-full transition-colors w-full">Close</button>`;
            showModal(html);
        }

        function removeWordFromPool(poolType, index) {
            playSFX('fish_out');
            const pool = poolType === 'hard' ? hardPoolContent : softPoolContent;
            const wordData = pool.splice(index, 1)[0];
            addWordToBankDOM(wordData);
            wordsRemaining++; updateWordsLeft(); updatePoolCounters(); showPoolModal(poolType); 
        }

        function checkAnswers() {
            let correct = 0, penalty = 0, returned = [];
            
            [...hardPoolContent, ...softPoolContent].forEach(w => {
                if ((w.type === 'hard' && hardPoolContent.includes(w)) || (w.type === 'soft' && softPoolContent.includes(w))) correct++;
                else { penalty += 10; returned.push(w); }
            });

            updateScore((correct * 10) - penalty);

            if (returned.length > 0) {
                playSFX('wrong');
                returned.forEach(addWordToBankDOM);
                wordsRemaining += returned.length; updateWordsLeft();
                
                hardPoolContent = hardPoolContent.filter(w => !returned.includes(w));
                softPoolContent = softPoolContent.filter(w => !returned.includes(w));
                updatePoolCounters();

                const bankItems = Array.from(wordBankEl.children);
                const newlyAdded = bankItems.slice(-returned.length);
                newlyAdded.forEach(el => { el.classList.add('anim-wrong'); setTimeout(() => el.classList.remove('anim-wrong'), 600); });

                showModal(`
                    <div class="text-7xl mb-4 drop-shadow-md">🌊</div>
                    <h2 class="text-3xl brand-font font-black text-red-600 mb-2">Washback!</h2>
                    <p class="text-slate-600 mb-4 font-bold">You placed ${returned.length} skill(s) in the wrong pool. We've returned them to the bank.</p>
                    <div class="bg-red-50 text-red-700 font-black text-xl py-3 rounded-xl mb-8 border border-red-200">Penalty: -${penalty} Points</div>
                    <button onclick="hideModal(); playSFX('pop');" class="btn-3d bg-slate-800 hover:bg-slate-900 border-slate-950 text-white font-extrabold py-4 px-8 rounded-full w-full">Try Again</button>
                `);
            } else {
                playSFX('correct'); fireConfetti(); checkActionContainer.classList.add('hidden');
                setTimeout(() => {
                    if (currentLevel < levelData.length - 1) {
                        showModal(`
                            <div class="text-7xl mb-4 drop-shadow-md">🌟</div>
                            <h2 class="text-4xl brand-font font-black text-emerald-500 mb-2">Stage Cleared!</h2>
                            <p class="text-slate-500 font-bold mb-8">Flawless sorting. Keep it up!</p>
                            <button onclick="hideModal(); loadLevel(currentLevel + 1);" class="btn-3d bg-gradient-to-r from-emerald-400 to-emerald-600 border-emerald-700 hover:from-emerald-500 hover:to-emerald-700 text-white font-extrabold text-lg py-4 px-8 rounded-full w-full shadow-xl">Next Stage</button>
                        `);
                    } else {
                        playSFX('win');
                        setTimeout(fireConfetti, 600); setTimeout(fireConfetti, 1200);
                        
                        let rankTitle = "Campus Scholar 🎓", rankColor = "from-blue-600 to-indigo-600";
                        if (score >= 450) { rankTitle = "Grandmaster of Skills 🏆"; rankColor = "from-amber-500 to-yellow-400"; } 
                        else if (score >= 350) { rankTitle = "Campus Honor Graduate 🌟"; rankColor = "from-purple-600 to-pink-500"; }

                        showModal(`
                            <div class="relative py-2">
                                <div class="text-6xl md:text-7xl mb-3 animate-bounce">🎓</div>
                                <h2 class="text-3xl md:text-4xl brand-font font-black bg-clip-text text-transparent bg-gradient-to-r ${rankColor} mb-1">Graduation Day!</h2>
                                <p class="text-slate-500 font-bold text-sm md:text-base mb-4">You have successfully mastered all 5 Industry Skill Pools!</p>

                                <div class="bg-gradient-to-br from-slate-50 to-blue-50/80 rounded-3xl p-5 mb-6 border-2 border-slate-200/80 shadow-inner relative overflow-hidden">
                                    <div class="absolute -right-4 -bottom-4 text-8xl opacity-10 pointer-events-none">📜</div>
                                    <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-black rounded-full uppercase tracking-wider mb-2">Diploma Awarded</span>
                                    <h3 class="text-xl md:text-2xl font-black text-slate-800 brand-font">${rankTitle}</h3>
                                    
                                    <div class="grid grid-cols-2 gap-3 mt-4 text-center">
                                        <div class="bg-white/80 backdrop-blur-sm p-3 rounded-2xl border border-slate-200/60 shadow-sm">
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Final Score</p>
                                            <p class="text-3xl font-black text-emerald-600 brand-font mt-0.5">${score}</p>
                                        </div>
                                        <div class="bg-white/80 backdrop-blur-sm p-3 rounded-2xl border border-slate-200/60 shadow-sm">
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Stages Cleared</p>
                                            <p class="text-3xl font-black text-indigo-600 brand-font mt-0.5">5 / 5</p>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="hideModal(); initGame();" class="btn-3d bg-gradient-to-r from-purple-600 to-pink-500 border-purple-800 hover:from-purple-500 hover:to-pink-400 text-white font-extrabold text-lg py-4 px-8 rounded-full w-full shadow-xl">Play Again 🔄</button>
                            </div>
                        `);
                    }
                }, 800);
            }
        }

        document.addEventListener('DOMContentLoaded', () => initGame());
    </script>
</body>
</html>
